AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  AWS SAM Template for serverless portfolio website.

Parameters:
  ProjectName:
    Type: String
    Default: serverless-portfolio
    Description: Name of the project, used as prefix for resources.
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Environment stage (dev, staging, prod).
  EnablePointInTimeRecovery:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable DynamoDB Point-in-Time Recovery.
  AllowedOrigins:
    Type: String
    Default: "*"
    Description: Allowed origins for API Gateway CORS.
  LogLevel:
    Type: String
    Default: INFO
    Description: Log level for Lambda functions.
  CustomDomainName:
    Type: String
    Default: ""
    Description: Custom domain name (e.g., kiendev.site)
  ACMCertificateArn:
    Type: String
    Default: ""
    Description: ACM Certificate ARN in us-east-1 (required for custom domain)
  DeploymentPreferenceType:
    Type: String
    Default: AllAtOnce
    AllowedValues:
      - AllAtOnce
      - Canary10Percent5Minutes
      - Canary10Percent10Minutes
      - Linear10PercentEvery1Minute
      - Linear10PercentEvery2Minutes
    Description: CodeDeploy deployment preference for Lambda functions.

Conditions:
  IsPitEnabled: !Equals [!Ref EnablePointInTimeRecovery, "true"]
  HasCustomDomain: !Not [!Equals [!Ref CustomDomainName, ""]]

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: nodejs20.x
    Environment:
      Variables:
        PORTFOLIO_TABLE: !Ref PortfolioDataTable
        BLOGS_TABLE: !Ref BlogsTable
        CONTENT_BUCKET: !Ref ContentBucket
        LOG_LEVEL: !Ref LogLevel

Resources:
  # -------------------------------------------------------------
  # DynamoDB Tables
  # -------------------------------------------------------------
  PortfolioDataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-${Environment}-data"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsPitEnabled, true, false]
      SSESpecification:
        SSEEnabled: true


  BlogsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-${Environment}-blogs"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: slug
          AttributeType: S
      KeySchema:
        - AttributeName: slug
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsPitEnabled, true, false]
      SSESpecification:
        SSEEnabled: true

  # -------------------------------------------------------------
  # S3 Buckets
  # -------------------------------------------------------------
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-${Environment}-frontend-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  ContentBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-${Environment}-content-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # -------------------------------------------------------------
  # API Gateway (HTTP API)
  # -------------------------------------------------------------
  PortfolioHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-api"
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigins
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS

  # -------------------------------------------------------------
  # Lambda Functions
  # -------------------------------------------------------------
  PortfolioReadFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: functions/portfolio-read/app.handler
      AutoPublishAlias: live
      DeploymentPreference:
        Type: !Ref DeploymentPreferenceType
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PortfolioDataTable
        - DynamoDBCrudPolicy:
            TableName: !Ref BlogsTable
      Events:
        GetProfile:
          Type: HttpApi
          Properties:
            Path: /api/profile
            Method: GET
            ApiId: !Ref PortfolioHttpApi
        GetProjects:
          Type: HttpApi
          Properties:
            Path: /api/projects
            Method: GET
            ApiId: !Ref PortfolioHttpApi
        GetProjectById:
          Type: HttpApi
          Properties:
            Path: /api/projects/{id}
            Method: GET
            ApiId: !Ref PortfolioHttpApi
        GetSkills:
          Type: HttpApi
          Properties:
            Path: /api/skills
            Method: GET
            ApiId: !Ref PortfolioHttpApi
        GetExperiences:
          Type: HttpApi
          Properties:
            Path: /api/experiences
            Method: GET
            ApiId: !Ref PortfolioHttpApi
        GetEducation:
          Type: HttpApi
          Properties:
            Path: /api/education
            Method: GET
            ApiId: !Ref PortfolioHttpApi
        GetBlogs:
          Type: HttpApi
          Properties:
            Path: /api/blogs
            Method: GET
            ApiId: !Ref PortfolioHttpApi
        GetBlogBySlug:
          Type: HttpApi
          Properties:
            Path: /api/blogs/{slug}
            Method: GET
            ApiId: !Ref PortfolioHttpApi
        WarmupSchedule:
          Type: Schedule
          Properties:
            Schedule: "rate(5 minutes)"
            Input: '{"source": "serverless-portfolio-warmup"}'
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "node20"
        EntryPoints:
          - functions/portfolio-read/app.ts
        External:
          - "@aws-sdk/*"

  ContactFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: functions/contact/app.handler
      AutoPublishAlias: live
      DeploymentPreference:
        Type: !Ref DeploymentPreferenceType
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PortfolioDataTable
      Events:
        PostContact:
          Type: HttpApi
          Properties:
            Path: /api/contacts
            Method: POST
            ApiId: !Ref PortfolioHttpApi
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "node20"
        EntryPoints:
          - functions/contact/app.ts
        External:
          - "@aws-sdk/*"

  CloudFrontInvalidationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-invalidate-cache"
      Description: "Invalidates CloudFront distribution paths (directly or via CodePipeline)"
      CodeUri: backend/
      Handler: functions/invalidate-cache/app.handler
      Environment:
        Variables:
          DISTRIBUTION_ID: !Ref CloudFrontDistribution
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cloudfront:CreateInvalidation
                - cloudfront:GetInvalidation
              Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"
            - Effect: Allow
              Action:
                - codepipeline:PutJobSuccessResult
                - codepipeline:PutJobFailureResult
              Resource: "*"
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "node20"
        EntryPoints:
          - functions/invalidate-cache/app.ts
        External:
          - "@aws-sdk/*"

  # -------------------------------------------------------------
  # CloudFront Distribution & Origins
  # -------------------------------------------------------------
  CloudFrontOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Description: "Origin Access Control for S3 origins"
        Name: !Sub "${ProjectName}-${Environment}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  ContentRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-ContentRewrite"
      FunctionConfig:
        Comment: "Strips /content prefix from URIs"
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri.startsWith('/content/')) {
            request.uri = uri.replace(/^\/content/, '');
          }
          return request;
        }
      AutoPublish: true

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "CloudFront Distribution for ${ProjectName} ${Environment}"
        Enabled: true
        HttpVersion: http2
        DefaultRootObject: index.html
        Aliases:
          !If
            - HasCustomDomain
            - - !Ref CustomDomainName
              - !Sub "www.${CustomDomainName}"
            - !Ref "AWS::NoValue"
        ViewerCertificate:
          !If
            - HasCustomDomain
            - AcmCertificateArn: !Ref ACMCertificateArn
              SslSupportMethod: sni-only
              MinimumProtocolVersion: TLSv1.2_2021
            - CloudFrontDefaultCertificate: true
        Origins:
          - Id: FrontendS3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !GetAtt CloudFrontOac.Id
          - Id: ContentS3Origin
            DomainName: !GetAtt ContentBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !GetAtt CloudFrontOac.Id
          - Id: ApiOrigin
            DomainName: !Sub "${PortfolioHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
        DefaultCacheBehavior:
          TargetOriginId: FrontendS3Origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # CachingOptimized
        CacheBehaviors:
          - PathPattern: /content/*
            TargetOriginId: ContentS3Origin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # CachingOptimized
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt ContentRewriteFunction.FunctionMetadata.FunctionARN
          - PathPattern: /api/*
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # AllViewerExceptHostHeader (to forward auth headers)
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

  # -------------------------------------------------------------
  # S3 Bucket Policies to allow OAC Read
  # -------------------------------------------------------------
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOACRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${FrontendBucket}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

  ContentBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ContentBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOACRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${ContentBucket}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

Outputs:
  CloudFrontURL:
    Description: "CloudFront Distribution URL"
    Value: !Sub "https://${CloudFrontDistribution.DomainName}"
  APIURL:
    Description: "API Gateway Endpoint"
    Value: !Sub "https://${PortfolioHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  FrontendBucketName:
    Description: "Frontend S3 Bucket Name"
    Value: !Ref FrontendBucket
  ContentBucketName:
    Description: "Content S3 Bucket Name"
    Value: !Ref ContentBucket
  DynamoDBTableName:
    Description: "DynamoDB Table Name"
    Value: !Ref PortfolioDataTable
  BlogsTableName:
    Description: "Blogs DynamoDB Table Name"
    Value: !Ref BlogsTable
  CloudFrontDistributionId:
    Description: "CloudFront Distribution ID"
    Value: !Ref CloudFrontDistribution
  CloudFrontInvalidationFunctionName:
    Description: "CloudFront Invalidation Lambda Function Name"
    Value: !Ref CloudFrontInvalidationFunction
