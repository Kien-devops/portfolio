version: 0.2

env:
  shell: bash

phases:
  install:
    commands:
      - aws --version
  pre_build:
    commands:
      - test -n "$FRONTEND_BUCKET"
      - test -d frontend/dist
  build:
    commands:
      - aws s3 sync frontend/dist/ "s3://$FRONTEND_BUCKET/" --delete --exclude "index.html" --cache-control "public,max-age=31536000,immutable"
      - aws s3 cp frontend/dist/index.html "s3://$FRONTEND_BUCKET/index.html" --cache-control "no-cache,max-age=0,must-revalidate" --content-type "text/html"
