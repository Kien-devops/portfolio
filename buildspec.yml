version: 0.2

env:
  shell: bash
  variables:
    STACK_NAME: serverless-portfolio-prod
    AWS_DEFAULT_REGION: ap-southeast-1
    CUSTOM_DOMAIN: kiendev.site
    ACM_CERTIFICATE_ARN: arn:aws:acm:us-east-1:404063515739:certificate/7f84066e-d34c-4959-bcde-6849565c8c90

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "=== 1. Checking Tooling Versions ==="
      - node --version
      - npm --version
      - sam --version
      - aws --version
      - echo "=== 2. Installing Project Dependencies ==="
      - npm ci
      - export PATH="$CODEBUILD_SRC_DIR/node_modules/.bin:$PATH"
      - esbuild --version

  pre_build:
    commands:
      - echo "=== 3. Testing Backend ==="
      - npm run test:backend
      - echo "=== 4. Building Backend Artifacts ==="
      - npm run build:backend
      - echo "=== 5. Building Frontend Bundle ==="
      - npm run build:frontend

  build:
    commands:
      - echo "=== 6. Building SAM Infrastructure Template ==="
      - export PATH="$CODEBUILD_SRC_DIR/node_modules/.bin:$PATH"
      - sam build --template-file template.yaml

      - echo "=== 7. Deploying Serverless Infrastructure ==="
      - sam deploy --no-confirm-changeset --no-fail-on-empty-changeset --stack-name "$STACK_NAME" --region "$AWS_DEFAULT_REGION" --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND --resolve-s3 --parameter-overrides ProjectName=serverless-portfolio Environment=prod CustomDomainName="$CUSTOM_DOMAIN" ACMCertificateArn="$ACM_CERTIFICATE_ARN" DeploymentPreferenceType=AllAtOnce

  post_build:
    commands:
      - echo "=== 8. Syncing Frontend Bundle to S3 ==="
      - FRONTEND_BUCKET=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_DEFAULT_REGION" --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue" --output text)
      - echo "Frontend Bucket: $FRONTEND_BUCKET"
      - aws s3 sync frontend/dist "s3://${FRONTEND_BUCKET}" --delete

      - echo "=== 9. Uploading Content / Blogs to S3 ==="
      - npm run upload-content || true

      - echo "=== 10. Invoking CloudFront Invalidation Lambda ==="
      - INVALIDATION_FN=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_DEFAULT_REGION" --query "Stacks[0].Outputs[?OutputKey=='CloudFrontInvalidationFunctionName'].OutputValue" --output text)
      - |
        if [ -n "$INVALIDATION_FN" ] && [ "$INVALIDATION_FN" != "None" ]; then
          echo "Invoking Lambda Invalidator: $INVALIDATION_FN"
          aws lambda invoke --function-name "$INVALIDATION_FN" --payload '{"paths":["/*"]}' /tmp/invalidation-response.json
          cat /tmp/invalidation-response.json
        else
          echo "Warning: Invalidation Lambda not found, falling back to direct CloudFront invalidation"
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_DEFAULT_REGION" --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" --output text)
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
        fi

      - echo "=== Deployment & Invalidation Complete ==="

artifacts:
  files:
    - template.yaml
    - buildspec.yml
  discard-paths: yes

cache:
  paths:
    - /root/.npm/**/*
    - node_modules/**/*
