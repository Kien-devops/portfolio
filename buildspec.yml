version: 0.2

env:
  shell: bash
  variables:
    STACK_NAME: serverless-portfolio-prod
    AWS_DEFAULT_REGION: ap-southeast-1
    CUSTOM_DOMAIN: kiendev.site
    ACM_CERTIFICATE_ARN: arn:aws:acm:us-east-1:404063515739:certificate/7f84066e-d34c-4959-bcde-6849565c8c90

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "=== 1. Tooling Versions ==="
      - node --version
      - npm --version
      - sam --version
      - aws --version
      - echo "=== 2. Installing Dependencies ==="
      - npm ci
      - export PATH="$CODEBUILD_SRC_DIR/node_modules/.bin:$PATH"
      - esbuild --version

  pre_build:
    commands:
      - echo "=== 3. Running Backend Tests ==="
      - npm run test:backend
      - echo "=== 4. Building Backend Artifacts ==="
      - npm run build:backend
      - echo "=== 5. Building Frontend Bundle ==="
      - npm run build:frontend

  build:
    commands:
      - echo "=== 6. Building SAM Infrastructure Template ==="
      - export PATH="$CODEBUILD_SRC_DIR/node_modules/.bin:$PATH"
      - sam build --template-file template.yaml

      - echo "=== 7. Deploying Backend Infrastructure via SAM ==="
      - sam deploy --no-confirm-changeset --no-fail-on-empty-changeset --stack-name "$STACK_NAME" --region "$AWS_DEFAULT_REGION" --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND --resolve-s3 --parameter-overrides ProjectName=serverless-portfolio Environment=prod CustomDomainName="$CUSTOM_DOMAIN" ACMCertificateArn="$ACM_CERTIFICATE_ARN" DeploymentPreferenceType=AllAtOnce

  post_build:
    commands:
      - echo "=== 8. Uploading Content & Blogs to S3 ==="
      - npm run upload-content || true
      - echo "=== Backend Build & Deploy Complete. Frontend artifact prepared for S3 Deploy stage ==="

artifacts:
  base-directory: frontend/dist
  files:
    - '**/*'

cache:
  paths:
    - /root/.npm/**/*
    - node_modules/**/*
